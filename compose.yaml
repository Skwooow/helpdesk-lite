services:
  db:
    image: postgres:17
    container_name: helpdesk-lite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev_password
    ports:
      - "5433:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data

volumes:
  helpdesk_postgres_data:
